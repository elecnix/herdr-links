id = "herdr-links"
name = "Herdr Links"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Session-bound navigation links for agent, workspace, tab, and pane references in Herdr."
platforms = ["macos"]

# Commands run through a login shell because Herdr spawns plugin commands with
# a minimal PATH (/usr/bin:/bin:/usr/sbin:/sbin) that omits the directories a
# version manager or Homebrew installs node into. A plain `node` then fails
# with ENOENT and every action reports "No such file or directory (os error 2)".
# The login shell reads the user's profile, which puts node back on PATH.
# A shell also means the version-manager shim, not a hardcoded path, is used.

[[build]]
command = ["/bin/sh", "-lc", "npm ci --include=dev --ignore-scripts --no-audit --no-fund"]

[[build]]
command = ["/bin/sh", "-lc", "npm run build"]

[[actions]]
id = "setup"
title = "Herdr Links: install Pi instructions"
command = ["/bin/sh", "-lc", "node ./dist/cli.js setup"]

[[actions]]
id = "cleanup"
title = "Herdr Links: remove Pi instructions"
command = ["/bin/sh", "-lc", "node ./dist/cli.js cleanup"]

[[actions]]
id = "navigate"
title = "Herdr Links: navigate clicked reference"
command = ["/bin/sh", "-lc", "node ./dist/cli.js handle"]

[[link_handlers]]
id = "navigation-v1"
title = "Navigate a verified local Herdr reference"
pattern = '^(?:https://herdr\.invalid/v1|herdr://navigation/v1)/(?:[0-9a-f]{64}/)?(?:(?:agent|pane)/w[0-9A-HJKMNP-TV-Z]{1,13}:p[0-9A-HJKMNP-TV-Z]{1,13}|workspace/w[0-9A-HJKMNP-TV-Z]{1,13}|tab/w[0-9A-HJKMNP-TV-Z]{1,13}:t[0-9A-HJKMNP-TV-Z]{1,13})$'
action = "navigate"
